# ============================================================
#  ParkTech - Configuración principal
# ============================================================
spring.application.name=parktech
server.port=8080

# ---------- Conexión a MySQL ----------
# La contraseña se toma de la variable de entorno MYSQL_PASSWORD;
# si no existe, se usa el valor que está después de los dos puntos.
spring.datasource.url=jdbc:mysql://localhost:3306/parktech_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:TU_CONTRASENA_MYSQL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# update: crea o actualiza las tablas según las clases @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- JSON ----------
# Fechas en formato ISO legible (2026-11-21T10:30:00) en lugar de números
spring.jackson.serialization.write-dates-as-timestamps=false
